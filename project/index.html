n| `flow.mmd` | **Mermaid** | **🔄 Control flow diagram** | Function call paths with complexity styling |\n| `calls.mmd` | **Mermaid** | **📞 Call graph** | Function dependencies (edges only) |\n| `compact_flow.mmd` | **Mermaid** | **📦 Module overview** | Aggregated module-level view |\n\n## 🚀 Quick Start Commands\n\n### Basic Analysis\n```bash\n# Quick health check (TOON format only)\ncode2llm ./ -f toon\n\n# Generate all formats (what created these files)\ncode2llm ./ -f all\n\n# LLM-ready context only\ncode2llm ./ -f context\n```\n\n### Performance Options\n```bash\n# Fast analysis for large projects\ncode2llm ./ -f toon --strategy quick\n\n# Memory-limited analysis\ncode2llm ./ -f all --max-memory 500\n\n# Skip PNG generation (faster)\ncode2llm ./ -f all --no-png\n```\n\n### Refactoring Focus\n```bash\n# Get refactoring recommendations\ncode2llm ./ -f evolution\n\n# Focus on specific code smells\ncode2llm ./ -f toon --refactor --smell god_function\n\n# Data flow analysis\ncode2llm ./ -f flow --data-flow\n```\n\n## 📖 Understanding Each File\n\n### `analysis.toon` - Health Diagnostics\n**Purpose**: Quick overview of code health issues\n**Key sections**:\n- **HEALTH**: Critical issues (🔴) and warnings (🟡)\n- **REFACTOR**: Prioritized refactoring actions\n- **COUPLING**: Module dependencies and potential cycles\n- **LAYERS**: Package complexity metrics\n- **FUNCTIONS**: High-complexity functions (CC ≥ 10)\n- **CLASSES**: Complex classes needing attention\n\n**Example usage**:\n```bash\n# View health issues\ncat analysis.toon | head -30\n\n# Check refactoring priorities\ngrep \"REFACTOR\" analysis.toon\n```\n\n### `evolution.toon.yaml` - Refactoring Queue\n**Purpose**: Step-by-step refactoring plan\n**Key sections**:\n- **NEXT**: Immediate actions to take\n- **RISKS**: Potential breaking changes\n- **METRICS-TARGET**: Success criteria\n\n**Example usage**:\n```bash\n# Get refactoring plan\ncat evolution.toon.yaml\n\n# Track progress\ngrep \"NEXT\" evolution.toon.yaml\n commitment,\n  but doql v1.0.12 already depends on op3 as a production dependency.\n\n---\n\n## Sprint 1 — API freeze + 0.2.0 (this iteration)\n\nGoal: make op3 a formally stable dependency for doql 1.x and upcoming\nredeploy integration.\n\n1. **Single source of version truth.**\n   - `_version.py` reads `VERSION` file (or exports constant kept in sync by release tooling).\n   - `opstree/__init__.py` imports `__version__` from `_version.py`.\n   - `cli/main.py` uses `click.version_option(version=__version__)`.\n   - Runtime code (`scanner/linear.py`, `drift/detector.py`,\n     `cli/commands/convert.py`, `formats/snapshot_yaml.py`) stops\n     hardcoding `scanner_version` — reads from `opstree.__version__`.\n2. **Write `docs/API.md`.**\n   Document the public surface committed to by 0.2.0:\n   - `LayerTree`, builtin layers\n   - `Snapshot`, `LayerData`, `PartialSnapshot`, `snapshot_diff`, `Change`\n   - `Probe`, `ProbeContext`, `ProbeResult`, `ProbeRegistry`, `register_probe`\n   - `LinearScanner`, `scan_device`, `build_layer_tree`, `build_scanner`\n   - `FormatRegistry`, `register_format`\n   - `DriftDetector`, `DriftReport`\n   - `Diagnostic`, `Rule`, `RuleEngine`, `Severity`\n   - Contract note: changes to signatures or return types of any of the\n     above require a minor bump (0.2 → 0.3).\n3. **Bump to 0.2.0.** Add CHANGELOG entry framing the release as \"API stable\".\n\n---\n\n## Sprint 2 — Fleet scan (DONE, shipped in [Unreleased])\n\nGoal achieved via native implementation rather than\n`fraq.adapters.HybridAdapter` wrapping. Investigation showed\n`HybridAdapter` is an adapter-of-adapters for `FraqNode`, not a\nsnapshot merger — the original plan was based on assumed API.\n\nDelivered:\n\n- `opstree.fleet` subpackage: `FleetSnapshot`, `FleetVariance`,\n  `scan_fleet`, `compute_variance`.\n- `scan_fleet(scanner, target_execute, *, max_workers=None)` uses\n  `concurrent.futures.ThreadPoolExecutor` (I/O-bound work).\n- `compute_variance(snapshots)` pure function; empty/single-snapshot\n  input returns `FleetVariance(fields={}, by_layer={})`.\n- Per-layer count exposed via `FleetVariance.by_layer`.\n- 15 new tests (`tests/unit/test_fleet.py`). Total suite 109 passed.\n\nWhat this unblocks downstream:\n\n- `doql adopt --from-fleet \"tag:kiosk\"` — scan cohort, derive shared\n  LESS; varying fields become variants/variables.\n- `redeploy drift --fleet` — verify a tag cohort in one pass.\n\n---\n\n## Sprint 3 — LessAdapter feature extensions (asymmetric contract)\n\nPer analysis \"Option 3\": doql stays the richer parser, op3 extends its\nLESS adapter only with features it actually needs for round-trip:\n\n- Inline comments\n- Escape sequences\n- Multi-line values\n\nExplicitly **out of scope for op3's LessAdapter** (stay in doql):\n\n- `@variables`\n- `@import`\n- Complex nested selectors beyond what builtin layers need\n\nParity test: `LessAdapter` parses every `.doql.less` fixture from\n`examples/doql/` and `examples/redeploy/` without errors. Advanced\nfeatures silently dropped with a warning (not hard failure).\n\n---\n\n## Sprint 4 — AdaptiveScanner with anomaly → follow-up\n\nPrerequisite: Sprints 1–3 complete and stable.\n\nScanner backtracking & anomaly-driven follow-up probes. Concrete\nbenchmark from session 109 on `c2004/pi109`: scanner must detect\n\"HDMI + DSI enabled simultaneously\" and suggest a `kanshi` profile\nreconciliation probe.\n\nDeferred spec — lock after Sprint 3.\n\n---\n\n## Cross-project items (not op3, but op3 participates)\n\nTracked here for context; execute in the owning repo.\n\n- **doql** — `PARSER_AUDIT.md` comparing doql LESS parser vs op3\n  `LessAdapter`. Precondition for Sprint 3 decisions on both sides.\n- **doql** — parity test `adopt --from-device → build` using op3\n  as the device scanner.\n- **redeploy** — `redeploy drift` command built on `op3.DriftDetector`\n  (new capability, strangler-fig style).\n- **c2004/redeploy/pi109** — `manifest.yaml` orchestrator draft, links\n  `migration.md`, `resume.md`, `waveshare-8-inch.md`, and invokes\n  `op3 drift` as verification phase.\n\n---\n\n## Open questions\n\n- Should `_version.py` be auto-generated by release tooling or hand-edited?\n  Current preference: single literal in `_version.py`, `VERSION` file\n  is a build artifact (or vice versa — pick one).\n- After Sprint 1, does doql pin `op3 >= 0.2, < 0.3` or `>= 0.2`?\n  Recommend pinning minor during the 0.x phase even after \"API stable\".\n", "is_subdir": false}, {"name": "calls.mmd", "rel_path": "calls.mmd", "path": "calls.mmd", "size": "3.5KB", "icon": "📈", "type": "mermaid", "type_name": "Mermaid", "content": "flowchart LR\n    subgraph src__opstree\n        src__opstree__probes__builtin__rpi_diagnostics___backlight_power_off_rules[&quot;_backlight_power_off_rules&quot;]\n        src__opstree__probes__builtin__rpi_diagnostics___all_ok[&quot;_all_ok&quot;]\n        src__opstree__drift__detector__DriftDetector__detect[&quot;detect&quot;]\n        src__opstree__probes__registry__ProbeRegistry__all[&quot;all&quot;]\n        src__opstree__fleet__scanner__scan_fleet[&quot;scan_fleet&quot;]\n        src__opstree__probes__builtin__rpi_diagnostics___backlight_chip_addr[&quot;_backlight_chip_addr&quot;]\n        src__opstree__fleet__scanner___flatten_snapshot[&quot;_flatten_snapshot&quot;]\n        src__opstree__snapshot__diff__snapshot_diff[&quot;snapshot_diff&quot;]\n        src__opstree__probes__builtin__rpi_diagnostics___all_ok_rule[&quot;_all_ok_rule&quot;]\n        src__opstree__fleet__scanner___flatten[&quot;_flatten&quot;]\n        src__opstree__snapshot__diff___diff_layer_data[&quot;_diff_layer_data&quot;]\n        src__opstree__probes__builtin__rpi_diagnostics___dsi_outputs[&quot;_dsi_outputs&quot;]\n        src__opstree__probes__builtin__rpi_diagnostics___i2c_buses[&quot;_i2c_buses&quot;]\n        src__opstree__probes__builtin__rpi_diagnostics___has_dsi_overlay[&quot;_has_dsi_overlay&quot;]\n        src__opstree__probes__builtin__rpi_dia         function renderFileList(filter = '') {
            const list = document.getElementById('fileList');
            const filtered = files.filter(f =>
                f.name.toLowerCase().includes(filter.toLowerCase()) ||
                f.path.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">No files found</div>';
                return;
            }

            // Group by type
            const groups = {};
            for (const file of filtered) {
                const type = file.type_name;
                if (!groups[type]) groups[type] = [];
                groups[type].push(file);
            }

            let html = '';
            for (const [typeName, groupFiles] of Object.entries(groups)) {
                html += `
                    <div class="file-group">
                        <div class="file-group-title">${typeName} Files (${groupFiles.length})</div>
                        ${groupFiles.map(f => `
                            <div class="file-item ${currentFile?.name === f.name ? 'active' : ''}"
                                 onclick="selectFile('${f.name}')">
                                <span class="file-icon">${f.icon}</span>
                                <div class="file-info">
                                    <div class="file-name">${f.name}</div>
                                    <div class="file-meta">${f.path}</div>
                                </div>
                                <span class="file-size">${f.size}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            list.innerHTML = html;
        }

        function selectFile(name) {
            const file = files.find(f => f.name === name);
            if (!file) return;

            currentFile = file;

            document.getElementById('contentIcon').textContent = file.icon;
            document.getElementById('contentTitle').textContent = file.name;

            // Actions
            const actions = document.getElementById('contentActions');
            actions.innerHTML = `
                <a href="${file.rel_path}" download class="btn">⬇ Download</a>
                <a href="${file.rel_path}" target="_blank" class="btn btn-primary">↗ Open Raw</a>
            `;

            // Content
            const body = document.getElementById('contentBody');
            if (file.type === 'markdown') {
                // Render markdown as HTML using marked.js
                body.innerHTML = `<div class="markdown-content">${marked.parse(file.content)}</div>`;
            } else if (file.type === 'html') {
                // For HTML files, show in iframe for safety
                body.innerHTML = `<iframe src="${file.rel_path}" style="width:100%;height:100%;border:none;border-radius:0.5rem;"></iframe>`;
            } else if (file.type === 'image') {
                // For images, display the actual image
                body.innerHTML = `<div class="image-preview"><img src="${file.rel_path}" alt="${file.name}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:0.5rem;"></div>`;
            } else if (file.type === 'mermaid') {
                // Render mermaid diagram
                const diagramId = 'mermaid-diagram-' + Date.now();
                body.innerHTML = `<div class="mermaid-content"><pre class="mermaid" id="${diagramId}">${file.content}</pre></div>`;
                // Initialize mermaid on the new element
                setTimeout(() => {
                    mermaid.init(undefined, document.getElementById(diagramId));
                }, 0);
            } else if (file.type === 'json') {
                try {
                    const json = JSON.parse(file.content.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&'));
                    const formatted = JSON.stringify(json, null, 2);
                    body.innerHTML = `<pre><code class="language-json">${formatted.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
                    hljs.highlightElement(body.querySelector('code'));
                } catch {
                    body.innerHTML = `<pre>${file.content}</pre>`;
                }
            } else if (file.type === 'yaml') {
                // YAML with syntax highlighting
                body.innerHTML = `<pre><code class="language-yaml">${file.content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
                hljs.highlightElement(body.querySelector('code'));

                hljs.highlightElement(body.querySelector('code'));
            } else {
                body.innerHTML = `<pre>${file.content}</pre>`;
            }
