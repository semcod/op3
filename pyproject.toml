[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "op3"
version = "0.1.14"
description = "Layered operations tree — observe, diff, orchestrate infrastructure as data"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Tom Sapletta", email = "tom@sapletta.com" }]

dependencies = [
    "fraq>=0.2.15",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "jmespath>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
ssh = ["paramiko>=3.0"]
async = ["httpx>=0.25"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]

[project.scripts]
op3 = "opstree.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/opstree"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
